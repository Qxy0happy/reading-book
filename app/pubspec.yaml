name: readingbook
description: "考研英语阅读本：离线阅读英语一历年真题文章与段落译文。"
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  drift: ^2.35.4
  sqlite3: ^3.9.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  assets:
    - assets/content.sqlite

  fonts:
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Variable.ttf
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Variable.ttf
