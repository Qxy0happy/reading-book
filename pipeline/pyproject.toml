[project]
name = "readingbook-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "reading-book contributors" }
]
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.4",
]

[project.scripts]
readingbook-build = "readingbook_pipeline:main"
readingbook-validate = "readingbook_pipeline:main"
readingbook-inspect = "readingbook_pipeline:main"
readingbook-pipeline = "readingbook_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
