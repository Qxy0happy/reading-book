name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Configure optional release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/keystore.jks
          cat > app/android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Compute version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Ensure only sample content
        run: python3 scripts/check_sample_content.py app/assets/content.sqlite
      - name: Build arm64 APK
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-name="$VERSION" --build-number="${{ github.run_number }}"
      - name: Rename APK
        run: cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk reading-book-android-arm64-v8a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: reading-book-android-arm64-v8a.apk
          if-no-files-found: error

  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev libstdc++-13-dev ninja-build pkg-config
      - name: Compute version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Ensure only sample content
        run: python3 scripts/check_sample_content.py app/assets/content.sqlite
      - name: Build Linux
        working-directory: app
        run: flutter build linux --release
      - name: Package Linux bundle
        run: |
          tar -czf "reading-book-linux-amd64-${VERSION}.tar.gz" \
            -C app/build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: reading-book-linux-amd64-*.tar.gz
          if-no-files-found: error

  release:
    needs: [android-arm64, linux-amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "reading-book $TAG" \
            --generate-notes \
            dist/*.apk dist/*.tar.gz dist/SHA256SUMS \
            || gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              dist/*.apk dist/*.tar.gz dist/SHA256SUMS --clobber
